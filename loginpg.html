<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>


<script src="https://cdn.tailwindcss.com"></script>


</head>

<body class="min-h-screen bg-gradient-to-br from-amber-100 to-orange-200 flex items-center justify-center">


<div class="bg-white w-full max-w-md p-8 rounded-2xl shadow-2xl">

    <h1 class="text-4xl font-bold text-purple-700 text-center mb-8">
        Login Page
    </h1>

    <form>
        <div class="space-y-5">

            <div>
                <label for="name" class="block text-purple-700 font-semibold mb-2">
                    Enter your name:
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter name"
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500"
                >
            </div>

            <div>
                <label for="email" class="block text-purple-700 font-semibold mb-2">
                    Enter the email:
                </label>

                <input
                    type="text"
                    id="email"
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500"
                >
            </div>

            <div>
                <label for="tel" class="block text-purple-700 font-semibold mb-2">
                    Enter mobile number
                </label>

                <input
                    type="number"
                    id="tel"
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500"
                >
            </div>

            <button
                type="button"
                class="w-full bg-purple-600 text-white font-semibold py-3 rounded-lg hover:bg-purple-700 transition duration-200 shadow-md"
            >
                <a href="homepg.html" class="block">
                    Submit
                </a>
            </button>

        </div>
    </form>

</div>


</body>
</html>
