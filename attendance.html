<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Page</title>

<script src="https://cdn.tailwindcss.com"></script>


</head>

<body class="min-h-screen bg-gradient-to-br from-purple-200 to-purple-400 flex items-center justify-center">

<div class="bg-white w-full max-w-md mx-6 p-8 rounded-2xl shadow-2xl text-center">

    <h1 class="text-4xl font-bold text-purple-700 mb-8">
        Attendance
    </h1>

    <div class="bg-green-100 border border-green-300 rounded-xl p-6 mb-8">

        <p class="text-3xl font-bold text-green-700">
            90%
        </p>

        <p class="text-gray-600 mt-2">
            Your Attendance
        </p>

    </div>

    <div class="text-left">

        <label
            for="dates"
            class="block text-purple-700 font-semibold mb-2"
        >
            Check your date
        </label>

        <input
            type="date"
            id="dates"
            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500"
        >

    </div>

    <a
        href="homepg.html"
        class="inline-block mt-8 bg-purple-600 text-white px-6 py-3 rounded-lg hover:bg-purple-700 transition"
    >
        Back to Home
    </a>

</div>

</body>
</html>
